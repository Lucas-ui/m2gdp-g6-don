openapi: "3.0.3"
info:
  title: "Donéo — API de vente caritative d'objets"
  version: "0.2.0"
  description: >
    API de la plateforme de don caritatif via la vente d'objets (groupe 6).
    Le donateur cède un objet, fixe une participation solidaire — un montant
    modeste — et choisit une association. Le bénéficiaire, étudiant ou personne
    dans le besoin, verse cette participation et repart avec l'objet à petit
    prix, tandis que l'argent va intégralement à l'association. Adresse exacte
    révélée après validation de la participation (paiement réel, mais en mode
    test). Contrat du scénario minimal Pré-J3 : inscription, publication, recherche,
    réservation et prise de contact. Les options avancées sont documentées
    séparément dans la roadmap et ne sont pas nécessaires au parcours nominal.

paths:
  /api/health:
    get:
      summary: "Healthcheck"
      responses:
        "200":
          description: "Service en ligne"

  # --- Authentification et profil ------------------------------------------
  # Ces trois routes sont DEJA implementees et deployees (POC J2). Elles avaient
  # disparu de ce fichier lors du pivot : on les redocumente telles qu'elles
  # fonctionnent aujourd'hui.

  /api/auth/statut-email:
    post:
      tags: ["Profils"]
      summary: "✉️ L'adresse a-t-elle déjà un compte ?"
      description: >
        Sert uniquement à adapter le message affiché (« lien de connexion » ou
        « lien pour créer votre compte »). Firebase n'envoie qu'un seul type de
        lien : seul le libellé change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: "Réponse"
          content:
            application/json:
              schema:
                type: object
                properties:
                  existe: { type: boolean }
        "400": { description: "Adresse invalide" }

  /api/profil:
    get:
      tags: ["Profils"]
      summary: "👤 Profil de l'utilisateur connecté"
      security: [{ jetonFirebase: [] }]
      responses:
        "200":
          description: "Profil"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profil" }
        "401": { description: "Authentification requise" }
        "404":
          description: >
            Profil inexistant. 404 volontaire : le front s'en sert pour savoir
            qu'il doit afficher le formulaire d'inscription.
    put:
      tags: ["Profils"]
      summary: "💾 Créer ou mettre à jour son profil"
      description: >
        L'e-mail est repris du jeton vérifié, jamais du corps de la requête :
        sinon n'importe qui pourrait s'enregistrer sous l'adresse d'un autre.
      security: [{ jetonFirebase: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilSoumis" }
      responses:
        "200": { description: "Profil mis à jour" }
        "201": { description: "Profil créé" }
        "401": { description: "Authentification requise" }
        "422": { description: "Champs invalides" }

  /api/utilisateurs:
    get:
      tags: ["Profils"]
      summary: "📇 Annuaire public des inscrits"
      description: >
        Liste BLANCHE : seuls les champs explicitement publics sortent. E-mail
        et adresse exacte ne sont jamais renvoyés. Tout champ ajouté au profil
        est exclu par défaut.
      responses:
        "200":
          description: "Liste"
          content:
            application/json:
              schema:
                type: object
                properties:
                  utilisateurs:
                    type: array
                    items: { $ref: "#/components/schemas/ProfilPublic" }
                  total: { type: integer }

  # --- Métier : vente caritative --------------------------------------------

  /api/associations:
    get:
      tags: ["Associations"]
      summary: "❤️ Lister les associations bénéficiaires"
      responses:
        "200":
          description: "Liste des associations sélectionnables par le donateur"

  /api/annonces:
    get:
      summary: "🔍 Rechercher des annonces"
      parameters:
        - name: q
          in: query
          description: "Recherche texte 🔤"
          schema: { type: string }
        - name: codePostal
          in: query
          description: "Filtre par code postal 📍"
          schema: { type: string }
      responses:
        "200":
          description: "Liste d'annonces (adresse approximative uniquement)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  annonces:
                    type: array
                    items: { $ref: "#/components/schemas/AnnoncePublique" }
                  total: { type: integer }
    post:
      tags: ["Annonces"]
      summary: "➕ Publier une annonce (donateur)"
      description: >
        Le donateur est repris du jeton vérifié, pas du corps : `donateurId` ne
        se déclare pas soi-même.
      security: [{ jetonFirebase: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnonceSoumise"
      responses:
        "201":
          description: "Annonce créée"
        "401": { description: "Authentification requise" }
        "422": { description: "Champs invalides" }

  /api/annonces/{id}:
    get:
      tags: ["Annonces"]
      summary: "Consulter une annonce"
      description: >
        Retourne la fiche publique de l'annonce. L'adresse exacte reste absente
        tant que la participation n'est pas validee.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Fiche publique de l'annonce"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnoncePublique" }
        "404": { description: "Annonce introuvable" }

  /api/annonces/{id}/conversation:
    post:
      tags: ["Conversations"]
      summary: "Contacter le donateur"
      description: >
        Cree ou retrouve la conversation entre le beneficiaire connecte et le
        donateur de l'annonce. Le premier message est facultatif a la creation.
      security: [{ jetonFirebase: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageSoumis" }
      responses:
        "201":
          description: "Conversation creee"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { description: "Authentification requise" }
        "404": { description: "Annonce introuvable" }

  /api/conversations/{id}/messages:
    get:
      tags: ["Conversations"]
      summary: "Lire les messages d'une conversation"
      security: [{ jetonFirebase: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Messages de la conversation"
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
        "401": { description: "Authentification requise" }
        "403": { description: "Utilisateur absent de la conversation" }
        "404": { description: "Conversation introuvable" }
    post:
      tags: ["Conversations"]
      summary: "Envoyer un message"
      security: [{ jetonFirebase: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageSoumis" }
      responses:
        "201":
          description: "Message envoye"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { description: "Authentification requise" }
        "403": { description: "Utilisateur absent de la conversation" }
        "404": { description: "Conversation introuvable" }

  /api/annonces/{id}/reservation:
    post:
      tags: ["Réservations"]
      summary: "🤝 Réserver un objet (participation en mode test → révèle l'adresse)"
      description: >
        Le bénéficiaire verse la participation solidaire et met l'objet de côté.
        Le paiement passe par un vrai prestataire, mais **en mode test** : il est
        réellement validé et porte une référence de transaction, alors que le
        montant débité est 0 et qu'aucun reversement réel n'a lieu. Le passage à
        `paye` est ce qui débloque l'adresse exacte, renvoyée QUE par cette
        réponse et jamais par une route de liste.
      security: [{ jetonFirebase: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reservation"
      responses:
        "201":
          description: "Réservation confirmée ; adresse exacte débloquée"
          content:
            application/json:
              schema:
                type: object
                properties:
                  statutPaiement: { type: string, enum: [paye] }
                  participationDemandee:
                    {
                      type: number,
                      description: "La participation réellement affichée au bénéficiaire",
                    }
                  montantDebite:
                    {
                      type: number,
                      enum: [0],
                      description: "Toujours 0 : mode test",
                    }
                  referencePaiement: { type: string }
                  numeroRue:
                    type: string
                    description: "🔓 Révélé ici, et seulement ici"
                  rue:
                    type: string
                    description: "🔓 Révélée ici, et seulement ici"
                  complementAdresse: { type: string }
        "401": { description: "Authentification requise" }
        "409": { description: "Annonce déjà réservée ou déjà remise" }

components:
  securitySchemes:
    jetonFirebase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Jeton d'identité Firebase obtenu après connexion par lien magique.
        Le Worker vérifie signature, expiration, audience et émetteur, puis
        agit avec la clé de service. Le front n'écrit jamais dans Firestore.

  schemas:
    Association:
      type: object
      required: [id, nom]
      properties:
        id:
          type: string
          description: "Identifiant de l'association 🆔"
        nom:
          type: string
          description: "Nom de l'association ❤️"
        description:
          type: string
          description: "Présentation de la cause 📝"

    # Schema de SOUMISSION (corps du POST). Il porte l'adresse exacte, que le
    # donateur doit bien renseigner quelque part. Ne jamais le reutiliser comme
    # schema de reponse sur une route de liste : voir AnnoncePublique.
    AnnonceSoumise:
      type: object
      required:
        [
          titre,
          description,
          categorie,
          etat,
          participation,
          associationId,
          creneauRetrait,
          numeroRue,
          rue,
          codePostal,
          ville,
        ]
      properties:
        titre:
          type: string
          maxLength: 80
          description: "Titre de l'objet 🏷 (ex : « Vélo de ville en bon état »)"
        description:
          type: string
          maxLength: 1000
          description: "Description de l'objet 📝"
        categorie:
          type: string
          enum:
            [mobilier, electromenager, electronique, vetements, materiel, autre]
          description: "Catégorie de l'objet 📦"
        etat:
          type: string
          enum: [neuf, bon_etat, usage]
          description: "État de l'objet ♻️"
        participation:
          type: number
          minimum: 0.01
          description: >
            Participation solidaire en euros 💶, fixée par le donateur.
            Obligatoire et versée intégralement à l'association. Elle se veut
            **modeste** — c'est une contribution à une cause, pas le prix de
            l'objet — mais aucun plafond n'est imposé techniquement.
        associationId:
          type: string
          description: "Association choisie par le donateur ❤️ — c'est elle qui touche l'argent"
        creneauRetrait:
          type: string
          description: "Créneau ponctuel de disponibilité pour le retrait ⏰ (ex : « samedi 14h-16h »)"
        numeroRue:
          type: string
          maxLength: 10
          description: "🔒 Privé jusqu'au paiement. Chaîne : « 14 bis » est valide."
        rue:
          type: string
          maxLength: 150
          description: "🔒 Privée jusqu'au paiement."
        complementAdresse:
          type: string
          maxLength: 100
          description: "🔒 Privé jusqu'au paiement. Facultatif."
        codePostal:
          type: string
          pattern: "^[0-9]{5}$"
          description: "🌍 Public — visible avant paiement."
        ville:
          type: string
          maxLength: 100
          description: "🌍 Publique — visible avant paiement."
        photos:
          type: array
          items: { type: string, format: uri }
          description: "URLs des photos (stockées sur R2) 📸"

    # Schema de REPONSE des routes de liste. Liste blanche : numeroRue, rue et
    # complementAdresse en sont absents PAR CONSTRUCTION, pas par filtrage.
    # C'est la regle posee dans agents.md.
    AnnoncePublique:
      type: object
      properties:
        id: { type: string }
        titre: { type: string }
        description: { type: string }
        categorie:
          { $ref: "#/components/schemas/AnnonceSoumise/properties/categorie" }
        etat: { $ref: "#/components/schemas/AnnonceSoumise/properties/etat" }
        participation:
          type: number
          description: "Participation solidaire 💶 — versée à l'association"
        associationId: { type: string }
        donateurId: { type: string }
        creneauRetrait:
          type: string
          description: "Créneau de retrait ⏰ — visible AVANT paiement"
        codePostal:
          type: string
          description: "📍 Visible AVANT paiement"
        ville:
          type: string
          description: "📍 Visible AVANT paiement"
        photos:
          type: array
          items: { type: string, format: uri }
        statut:
          type: string
          enum: [disponible, reserve, remis]
          default: disponible
          description: "Statut de l'annonce 🟢 — « remis » et non « vendu » : rien n'est vendu ici"
        creeLe: { type: string, format: date-time }
        misAJourLe: { type: string, format: date-time }

    Reservation:
      type: object
      properties:
        id: { type: string, readOnly: true }
        annonceId:
          type: string
          readOnly: true
          description: "Repris du chemin de la requête."
        beneficiaireId:
          type: string
          readOnly: true
          description: >
            Identifiant du bénéficiaire 👤 — repris du jeton vérifié, jamais du
            corps de la requête : sinon on pourrait réserver au nom d'un autre.
        participationDemandee:
          type: number
          readOnly: true
          description: >
            La **vraie** participation, celle affichée au bénéficiaire. Recopiée
            depuis `Annonce.participation` au moment de la réservation, pour
            qu'une modification ultérieure ne réécrive pas l'historique.
        montantDebite:
          type: number
          enum: [0]
          readOnly: true
          description: "💶 Ce qui est réellement prélevé : **0**, toujours."
        statutPaiement:
          type: string
          enum: [en_attente, paye, echoue]
          default: en_attente
          description: "🎭 `paye` débloque l'adresse exacte de l'annonce."
        referencePaiement:
          type: string
          readOnly: true
          description: >
            Identifiant de transaction renvoyé par le prestataire. Preuve que le
            tunnel de paiement a bien été parcouru, même en mode test.
        environnementPaiement:
          type: string
          enum: [test]
          readOnly: true
          description: >
            Toujours `test`. Rend explicite en base qu'aucune transaction réelle
            n'a eu lieu — à ne jamais basculer sur `production` dans ce projet.
        creeLe: { type: string, format: date-time, readOnly: true }

    Conversation:
      type: object
      required: [id, annonceId, donateurId, beneficiaireId, creeLe]
      properties:
        id: { type: string, readOnly: true }
        annonceId: { type: string, readOnly: true }
        donateurId: { type: string, readOnly: true }
        beneficiaireId: { type: string, readOnly: true }
        creeLe: { type: string, format: date-time, readOnly: true }
        misAJourLe: { type: string, format: date-time, readOnly: true }

    MessageSoumis:
      type: object
      required: [contenu]
      properties:
        contenu:
          type: string
          minLength: 1
          maxLength: 1000
          description: "Message envoye au participant de la conversation"

    Message:
      allOf:
        - $ref: "#/components/schemas/MessageSoumis"
        - type: object
          required: [id, conversationId, auteurId, creeLe]
          properties:
            id: { type: string, readOnly: true }
            conversationId: { type: string, readOnly: true }
            auteurId: { type: string, readOnly: true }
            creeLe: { type: string, format: date-time, readOnly: true }

    # --- Profils ------------------------------------------------------------
    # L'adresse est decomposee : cela permet de publier codePostal + ville sans
    # jamais laisser sortir le numero et la rue. Voir specs/data-model.md.

    ProfilSoumis:
      type: object
      required:
        [nom, prenom, roles, numeroRue, rue, codePostal, ville, dateNaissance]
      properties:
        nom: { type: string, minLength: 1, maxLength: 80 }
        prenom: { type: string, minLength: 1, maxLength: 80 }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [donateur, beneficiaire] }
          description: "Rôles cumulables 🎁🙋 : un même compte peut donner et acquérir."
        numeroRue:
          type: string
          maxLength: 10
          description: >
            🔒 Privé. Chaîne et non nombre : « 14 bis », « 3-5 » et « 12 ter »
            sont des numéros valides.
        rue:
          type: string
          minLength: 2
          maxLength: 150
          description: "🔒 Privé. Libellé de la voie, ex : « rue de la Charité »."
        complementAdresse:
          type: string
          maxLength: 100
          description: "🔒 Privé. Facultatif, ex : « Bât. B, appt 12 »."
        codePostal:
          type: string
          pattern: "^[0-9]{5}$"
          description: "🌍 Public — porte la proximité, affiché dans l'annuaire."
        ville:
          type: string
          minLength: 1
          maxLength: 100
          description: "🌍 Public — affichée dans l'annuaire à côté du code postal."
        dateNaissance:
          type: string
          format: date
          description: >
            Doit exister, ne pas être dans le futur, moins de 120 ans. Aucune
            condition d'âge : la plateforme est ouverte aux mineurs.

    Profil:
      allOf:
        - $ref: "#/components/schemas/ProfilSoumis"
        - type: object
          properties:
            id: { type: string, description: "Identifiant Firebase 🔑" }
            email:
              type: string
              format: email
              description: "🔒 Repris du jeton vérifié. Jamais exposé publiquement."
            photoUrl: { type: string }
            creeLe: { type: string, format: date-time }
            misAJourLe: { type: string, format: date-time }

    ProfilPublic:
      type: object
      description: "Ce qui sort de l'annuaire, et rien d'autre."
      properties:
        id: { type: string }
        prenom: { type: string }
        nom: { type: string }
        roles:
          type: array
          items: { type: string }
        photoUrl: { type: string }
        codePostal: { type: string }
        ville:
          type: string
          description: "Chaîne vide pour les profils antérieurs au champ."
