<!--
  Miniature Doneo : tuile violette, D blanc dont la contrepoince est un coeur.
  Le D est construit geometriquement (fut droit + demi-cercle de rayon 138),
  le coeur est evide en `evenodd` pour laisser passer le violet de la tuile :
  la forme reste juste quelle que soit la couleur du fond.
-->
